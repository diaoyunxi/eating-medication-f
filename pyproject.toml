[project]
name = "eating-medication-f"
dynamic = ["version"]
description = "UniHiker M10 智能服药提醒终端（固件端），支持人脸识别、语音提醒、远程监控"
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TCH", "PL", "RUF", "S"]
ignore = ["S101", "S603", "S607", "PLR0913", "PLR0915", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["m10"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
